name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MINIO_IMAGE: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
  POSTGRES_URL: postgres://rigforge:rigforge@localhost:5432/rigforge

jobs:
  # ---------------------------------------------------------------- api (Go)
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rigforge
          POSTGRES_PASSWORD: rigforge
          POSTGRES_DB: rigforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rigforge" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      # Service containers cannot be given a command, and MinIO needs one.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rigforge -e MINIO_ROOT_PASSWORD=rigforge-dev-secret \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 1
          done
      - name: Format
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Test (unit + integration against Postgres, Redis and MinIO)
        working-directory: api
        env:
          RIGFORGE_TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
          RIGFORGE_TEST_REDIS_URL: redis://localhost:6379/15
          RIGFORGE_TEST_S3_ENDPOINT: http://localhost:9000
        run: go test -race ./...

  # ------------------------------------------------------------ worker (Python)
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rigforge
          POSTGRES_PASSWORD: rigforge
          POSTGRES_DB: rigforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rigforge" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/pyproject.toml
      - name: System packages (ffmpeg and the libraries MediaPipe loads)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libegl1 libgles2
      - name: Install worker
        run: pip install -e "worker[dev]"
      - name: Cache the pose model
        uses: actions/cache@v4
        with:
          path: worker/models
          key: pose-landmarker-heavy-64437af8
      - name: Download the pose model (checksum verified)
        run: make models
      # The Khronos glTF validator is an npm package; the web project has it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install the glTF validator
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: worker
        run: ruff check . && ruff format --check .
      # Queue tests on a real Redis, the worker's SQL on the real schema, the
      # retargeting maths, and the pipeline smoke test on the sample clip
      # (which validates motion.glb with the Khronos validator).
      # RIGFORGE_REQUIRE_SERVICES turns "service missing: skip" into a failure.
      - name: Test
        working-directory: worker
        env:
          RIGFORGE_TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
          RIGFORGE_TEST_REDIS_URL: redis://localhost:6379/14
          RIGFORGE_REQUIRE_SERVICES: "1"
        run: python -m pytest tests -v
      - name: glTF-Validator smoke test on the sample clip
        run: |
          python -m rigforge_worker.main run docs/samples/power_jump.mp4 --out sample_out
          python -m rigforge_worker.main run docs/samples/power_jump.mp4 --character none --out sample_out_skeleton
          node web/scripts/validate-gltf.mjs \
            sample_out/motion.glb sample_out_skeleton/motion.glb worker/rig/default_character.glb
      - uses: actions/upload-artifact@v4
        with:
          name: sample-motion
          path: |
            sample_out/motion.glb
            sample_out/motion.bvh
            sample_out/preview.mp4

  # ---------------------------------------------------------------- web (TS)
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Unit and component tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # ------------------------------------------------- end to end (whole stack)
  e2e:
    runs-on: ubuntu-latest
    needs: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Playwright
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      # The resume tests generate a ~380 MiB video with ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Smoke test (curl)
        run: scripts/smoke_test.sh http://localhost:8081
      - name: Playwright
        working-directory: web
        run: pnpm exec playwright test
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  # ------------------------------------------------------------------ images
  images:
    runs-on: ubuntu-latest
    needs: [api, worker, web]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: api, target: api }
          - { name: issuer, context: api, target: issuer }
          - { name: worker, context: worker, target: "" }
          - { name: web, context: web, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry paths must be lower case; the account name is not.
      - id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/rigforge-${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  # ------------------------------------------------------- deploy (on a tag)
  # Runs only when the repository variable DEPLOY_ENABLED is "true", i.e. once
  # a cluster exists. It needs these repository secrets: KUBE_CONFIG (a
  # kubeconfig for the cluster), R2_CONFIG_ENV, R2_SECRET_ENV and
  # ISSUER_KEY_PEM (the contents of the three files the r2 overlay reads).
  deploy:
    runs-on: ubuntu-latest
    needs: [images, e2e]
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure cluster access and overlay inputs
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          R2_CONFIG_ENV: ${{ secrets.R2_CONFIG_ENV }}
          R2_SECRET_ENV: ${{ secrets.R2_SECRET_ENV }}
          ISSUER_KEY_PEM: ${{ secrets.ISSUER_KEY_PEM }}
        run: |
          umask 077
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          cd deploy/k8s/overlays/r2
          printf '%s\n' "$R2_CONFIG_ENV" > config.env
          printf '%s\n' "$R2_SECRET_ENV" > secret.env
          printf '%s\n' "$ISSUER_KEY_PEM" > issuer-key.pem
      - name: Pin the images to this release and apply
        working-directory: deploy/k8s/overlays/r2
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          for name in api issuer worker web; do
            kustomize edit set image "ghcr.io/ariankhademi/rigforge-$name=ghcr.io/$owner/rigforge-$name:$version"
          done
          kubectl apply -k .
          for workload in deployment/api deployment/worker deployment/web; do
            kubectl -n rigforge rollout status "$workload" --timeout=300s
          done
