[project]
name = "rigforge-worker"
version = "0.1.0"
description = "Rigforge video worker: ffmpeg transcoding, pose extraction and retargeting to glTF motion assets"
requires-python = ">=3.11,<3.12"
# Pinned exactly: the worker image must produce the same motion for the same
# video, and MediaPipe and numpy both change numerics between releases.
dependencies = [
    "mediapipe==1.0.0",
    "numpy==2.4.6",
    "redis==8.1.0",
    "boto3==1.43.108",
    "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff"]

[project.scripts]
rigforge-worker = "rigforge_worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rigforge_worker"]

[tool.setuptools.package-data]
rigforge_worker = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "redis: needs a real Redis (REDIS_URL / docker-compose)",
    "postgres: needs a real Postgres (RIGFORGE_TEST_DATABASE_URL)",
    "pipeline: runs ffmpeg and MediaPipe on the sample clip (slow)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["rigforge_worker"]
# Test helper modules that sit next to the tests.
known-local-folder = ["conftest", "fakes", "synth", "gltf_eval"]
