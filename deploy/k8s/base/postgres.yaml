# Postgres as a single-replica StatefulSet: a stable name and its own
# PersistentVolumeClaim that survives pod restarts. Good for a demo and small
# installs; a managed database would replace this in production.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: the StatefulSet pod is addressed directly
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: rigforge
            - name: POSTGRES_DB
              value: rigforge
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rigforge-secrets
                  key: POSTGRES_PASSWORD
            # A subdirectory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "rigforge", "-d", "rigforge"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "rigforge", "-d", "rigforge"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
